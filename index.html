<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도영비닐공업사</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', system-ui, sans-serif;
            line-height: 1.7;
            color: #333;
        }
        nav {
            position: sticky;
            top: 0;
            background: #1a3c6e;
            padding: 15px 0;
            z-index: 100;
        }
        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }
        .nav-menu a {
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .nav-menu a:hover {
            background: #2a5a9e;
            border-radius: 4px;
        }

        .section {
            padding: 80px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            color: #1a3c6e;
            text-align: center;
            margin-bottom: 60px;
            font-size: 2.8rem;
        }
        h2 {
            color: #1a3c6e;
            border-bottom: 3px solid #1a3c6e;
            padding-bottom: 12px;
            margin-bottom: 30px;
        }
        h3 {
            color: #1a3c6e;
            margin: 35px 0 15px 0;
        }
        .content {
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }
